# Optional parameter file for motion_demo_node. Launch arguments override
# these values. Angles in the planner are radians; hand positions are 0..255.
/**:
  ros__parameters:
    arm: right
    motion: extend
    speed: 0.2
    acce: 0.2
    state_timeout: 15.0
    service_timeout: 10.0
    hand_enabled: true
    hand_speed: 250
    hand_force: 250
    hand_close_position: 0
    hand_open_position: 255
