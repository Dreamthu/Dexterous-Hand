nut_detector_node:
  ros__parameters:
    # OrbbecSDK_ROS2 v2-main publishes these names under camera_name:=camera.
    color_topic: /camera/color/image_raw
    depth_topic: /camera/depth/image_raw
    camera_info_topic: /camera/color/camera_info
    target_frame: base_torso_root
    use_tf: true
    detection_topic: /nut_detections
    slot_topic: /nut_slots
    debug_image_topic: /nut_detection/debug_image
    publish_rate_hz: 5.0

    # Stage-aware large -> medium -> small identity/status output. The count
    # validates the current stage; only the event service advances the stage.
    sequence_topic: /nut_detections/sequence
    sequence_event_service: /nut_detections/set_state
    sequence_stable_frames: 3
    sequence_max_center_shift_px: 40.0
    sequence_max_radius_change_ratio: 0.20
    sequence_min_size_gap_ratio: 0.10
    sequence_max_gap_ms: 1000.0
    max_image_age_ms: 500.0
    max_depth_delta_ms: 100.0

    # HSV/geometry values; tune only if the lighting or materials change.
    # A small, slightly reflective black source frame.  Treat all low-value
    # HSV pixels as candidates; geometric checks below reject shadows/objects.
    black_v_max: 170
    # When true, publish/log black-frame candidate diagnostics.  Offline
    # replay also writes value_channel, pre-close mask and candidate overlay.
    debug_black_frame: true
    blue_h_min: 90
    blue_h_max: 140
    blue_s_min: 70
    blue_v_min: 35
    min_frame_area_ratio: 0.01
    max_frame_area_ratio: 0.10
    min_basket_area_ratio: 0.01
    frame_inner_scale: 0.94
    min_nut_radius_px: 5.0
    # The source frame is about 80px wide at the current fixed 640x360 view.
    # 24px excludes a contour made by several merged nuts.
    max_nut_radius_px: 24.0
    # Outer silhouette filters for the hexagonal nuts in reference diagram/*.jpg.
    # Position-only mode: keep small/partially reflective nut silhouettes.
    min_nut_area_px: 50.0
    max_nut_area_px: 100000.0
    adaptive_block_size: 51
    adaptive_c: 8.0
    blackhat_kernel_size: 51
    blackhat_threshold: 25.0
    # A light opening removes binary bridges/noise before the local close.
    nut_mask_open_kernel_size: 3
    # A 7x7 close bridged the three separated nuts in the current camera view.
    # Keep only local hole repair so individual outer silhouettes remain split.
    nut_mask_close_kernel_size: 3
    min_nut_solidity: 0.45
    min_nut_circularity: 0.25
    min_nut_aspect_ratio: 0.30
    # Disabled by default: Hough used to pad 0--2 contour detections to three.
    enable_hough_fallback: false
    hough_param2: 13.0
    min_nut_clearance_m: 0.003
    depth_min_m: 0.15
    depth_max_m: 5.0
    slot_axis: long
    # Reference photos include both camera orientations. Use "right" for the
    # fixed contest layout where the blue box is required to be on the right.
    basket_side: any
